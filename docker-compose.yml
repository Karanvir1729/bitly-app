version: "3"

services:
  redis:
    image: redis:7
    command: ["redis-server", "--save", "20", "1", "--loglevel", "warning"]
    networks:
      - backend
    deploy:
      placement:
        constraints:
          - node.role == manager

  api:
    image: bitly-api:v2
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      BASE_URL: "http://10.128.0.3"
    depends_on:
      - redis
    ports:
      - "80:8000"
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker

networks:
  backend:
    driver: overlay

